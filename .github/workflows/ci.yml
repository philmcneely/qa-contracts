name: contract-tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  contract-tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -e .
      - name: Unit
        run: pytest -v -m unit
      - name: Integration
        run: pytest -v -m integration
      - name: API
        run: pytest -v -m api
      - name: E2E
        run: pytest -v -m e2e
      - name: Full suite
        run: pytest -v
